name: Refine overview metric trends once

on:
  push:
    branches:
      - ui/overview-metric-trend-toggle

permissions:
  contents: write

jobs:
  patch-dashboard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/overview-metric-trend-toggle
          fetch-depth: 0

      - name: Apply overview refinement
        run: python scripts/refine_overview_metric_trends_once.py

      - name: Validate
        run: |
          python -m py_compile deployment/streamlit/app.py
          python - <<'PY'
          from pathlib import Path
          text = Path('deployment/streamlit/app.py').read_text(encoding='utf-8')
          checks = {
              'combined trend removed': 'overview-business-trend' not in text,
              'all-time helper exists': 'def all_time_metric_figure' in text,
              'metric toggle template exists': 'overview-{metric.lower()}-trend-view' in text,
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit(f'Overview refinement validation failed: {failed}')
          print('Overview refinement validation passed')
          PY

      - name: Commit dashboard change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/streamlit/app.py
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m "Refine overview metric trend views"
          git push
