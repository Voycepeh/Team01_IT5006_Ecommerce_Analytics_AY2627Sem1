name: Phase 3 classification app

on:
  pull_request:
    paths:
      - 'deployment/classification/**'
      - 'src/classification_*.py'
      - 'src/export_classification.py'
      - 'tests/test_classification_app.py'
      - 'notebooks/phase2_delivered_order_classification_final.ipynb'
      - 'data/processed/order_level.csv'
      - 'data/processed/item_level.csv'
      - '.github/workflows/classification-app.yml'
  push:
    branches: [main]
    paths:
      - 'deployment/classification/**'
      - 'src/classification_*.py'
      - 'src/export_classification.py'
      - 'tests/test_classification_app.py'
      - 'notebooks/phase2_delivered_order_classification_final.ipynb'
      - 'data/processed/order_level.csv'
      - 'data/processed/item_level.csv'
      - '.github/workflows/classification-app.yml'

jobs:
  classification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: deployment/classification/requirements.txt
      - name: Install application and notebook parity test dependencies
        run: python -m pip install -r deployment/classification/requirements.txt pytest matplotlib ipython
      - name: Test artifact, notebook parity and Streamlit form
        run: python -m pytest tests/test_classification_app.py -q
