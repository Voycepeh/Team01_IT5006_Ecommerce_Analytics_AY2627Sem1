name: Apply dashboard timing clarity patch

on:
  push:
    branches:
      - feature/dashboard-timing-clarity

permissions:
  contents: write

jobs:
  patch-dashboard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dashboard-timing-clarity
          fetch-depth: 0

      - name: Apply focused dashboard changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('deployment/streamlit/app.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'Expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'import plotly.graph_objects as go\nimport streamlit as st',
              'import plotly.graph_objects as go\nfrom plotly.subplots import make_subplots\nimport streamlit as st',
          )

          replace_once(
              'MONTH_ORDER = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]\n',
              '''MONTH_ORDER = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]\nDELIVERY_TIMING_ORDER = [\n    "30+ early",\n    "15–30 early",\n    "7–15 early",\n    "3–7 early",\n    "1–3 early",\n    "On time",\n    "1–3 late",\n    "3–7 late",\n    "7–15 late",\n    "15–30 late",\n    "30+ late",\n]\n''',
          )

          replace_once(
              'def delivered_orders(frame: pd.DataFrame) -> pd.DataFrame:\n    return frame[frame["is_delivered_complete"] & frame["delivery_days"].notna() & frame["estimated_delivery_days"].notna() & frame["days_late"].notna() & frame["is_late"].notna()].copy()\n\n\ndef page_insight',
              '''def delivered_orders(frame: pd.DataFrame) -> pd.DataFrame:\n    return frame[frame["is_delivered_complete"] & frame["delivery_days"].notna() & frame["estimated_delivery_days"].notna() & frame["days_late"].notna() & frame["is_late"].notna()].copy()\n\n\ndef delivery_timing_band(days_late):\n    """Classify delivery timing with an explicit on-time bucket."""\n    if pd.isna(days_late):\n        return pd.NA\n    value = float(days_late)\n    if value <= -30:\n        return "30+ early"\n    if value <= -15:\n        return "15–30 early"\n    if value <= -7:\n        return "7–15 early"\n    if value <= -3:\n        return "3–7 early"\n    if value < 0:\n        return "1–3 early"\n    if value == 0:\n        return "On time"\n    if value <= 3:\n        return "1–3 late"\n    if value <= 7:\n        return "3–7 late"\n    if value <= 15:\n        return "7–15 late"\n    if value <= 30:\n        return "15–30 late"\n    return "30+ late"\n\n\ndef page_insight''',
          )

          replace_once(
              '    y_title = "Orders" if metric == "Orders" else ("Gross merchandise value (R$)" if metric == "GMV" else "Average order value (R$)")\n    fig.update_layout(\n        title=title,\n        xaxis={"title": "Month", "categoryorder": "array", "categoryarray": MONTH_ORDER},\n        yaxis={"title": y_title, "tickformat": ","},',
              '    y_title = "Orders" if metric == "Orders" else ("Gross merchandise value (R$)" if metric == "GMV" else "Average order value (R$)")\n    fig.update_layout(\n        title=title,\n        xaxis={"title": "Month", "categoryorder": "array", "categoryarray": MONTH_ORDER},\n        yaxis={"title": y_title, "tickformat": ",", "rangemode": "tozero"},',
          )

          anchor = '\n\ndef contribution_figure(frame: pd.DataFrame, dimension: str, metric: str, title: str) -> go.Figure:\n'
          if text.count(anchor) != 1:
              raise RuntimeError('Could not find contribution_figure insertion point')
          trend_helper = r'''


def overview_trend_figure(monthly: pd.DataFrame, view: str) -> go.Figure:
    """Show order volume and AOV together using either all-time or YoY time framing."""
    fig = make_subplots(rows=2, cols=1, shared_xaxes=view == "All-time trend", vertical_spacing=0.12)
    if view == "All-time trend":
        fig.add_trace(
            go.Scatter(
                x=monthly["Month"], y=monthly["Orders"], mode="lines+markers", name="Orders",
                line={"color": BLUE, "width": 2.5}, marker={"size": 5},
                hovertemplate="%{x|%b %Y}<br>Orders: %{y:,.0f}<extra></extra>",
            ),
            row=1, col=1,
        )
        fig.add_trace(
            go.Scatter(
                x=monthly["Month"], y=monthly["AOV"], mode="lines+markers", name="Average order value",
                line={"color": ORANGE, "width": 2.5}, marker={"size": 5},
                hovertemplate="%{x|%b %Y}<br>AOV: R$%{y:,.2f}<extra></extra>",
            ),
            row=2, col=1,
        )
        fig.update_xaxes(title_text="Purchase month", row=2, col=1)
    else:
        data = monthly.copy()
        data["Year"] = data["Month"].dt.year
        data["Month number"] = data["Month"].dt.month
        data["Month label"] = data["Month"].dt.strftime("%b")
        for index, year in enumerate(sorted(data["Year"].unique())):
            year_data = data[data["Year"] == year].sort_values("Month number")
            color = YEAR_COLORS[index % len(YEAR_COLORS)]
            fig.add_trace(
                go.Scatter(
                    x=year_data["Month label"], y=year_data["Orders"], mode="lines+markers", name=str(year),
                    legendgroup=str(year), line={"color": color, "width": 2.5}, marker={"size": 5},
                    hovertemplate=f"%{{x}}<br>Orders: %{{y:,.0f}}<extra>{year}</extra>",
                ),
                row=1, col=1,
            )
            fig.add_trace(
                go.Scatter(
                    x=year_data["Month label"], y=year_data["AOV"], mode="lines+markers", name=str(year),
                    legendgroup=str(year), showlegend=False, line={"color": color, "width": 2.5}, marker={"size": 5},
                    hovertemplate=f"%{{x}}<br>AOV: R$%{{y:,.2f}}<extra>{year}</extra>",
                ),
                row=2, col=1,
            )
        fig.update_xaxes(categoryorder="array", categoryarray=MONTH_ORDER, row=1, col=1)
        fig.update_xaxes(title_text="Month", categoryorder="array", categoryarray=MONTH_ORDER, row=2, col=1)

    fig.update_yaxes(title_text="Orders", rangemode="tozero", row=1, col=1)
    fig.update_yaxes(title_text="Average order value (R$)", tickprefix="R$", rangemode="tozero", row=2, col=1)
    fig.update_layout(
        title="Order volume and average order value over time",
        legend={"title": "Year" if view == "Year-on-year" else "", "orientation": "h", "y": 1.08, "x": 0.5, "xanchor": "center"},
        hovermode="x unified" if view == "All-time trend" else "closest",
    )
    return styled(fig, 610)
'''
          text = text.replace(anchor, trend_helper + anchor, 1)

          replace_once(
              '    metric_config = {\n',
              '''    st.subheader("Business trend")\n    trend_view = _centered_pills("Trend view", ("All-time trend", "Year-on-year"), "overview-trend-view", "All-time trend")\n    chart(overview_trend_figure(monthly, trend_view), "overview-business-trend")\n    st.caption("All-time trend shows the full monthly trajectory; Year-on-year aligns calendar months for comparison. Both y-axes start at zero so small variations are not visually exaggerated.")\n    st.divider()\n\n    metric_config = {\n''',
          )

          old_delivery = '''        bins = [-999, -30, -15, -7, -3, 0, 3, 7, 15, 30, 999]\n        labels = ["30+ early", "15–30 early", "7–15 early", "3–7 early", "0–3 early", "0–3 late", "3–7 late", "7–15 late", "15–30 late", "30+ late"]\n        valid["Delivery timing"] = pd.cut(valid["days_from_promise"], bins=bins, labels=labels, ordered=True)\n        counts = valid.dropna(subset=["Delivery timing"]).groupby("Delivery timing", observed=False)["order_id"].nunique().rename("Orders").reset_index()\n        counts["Delivery timing"] = counts["Delivery timing"].astype(str)\n        early = counts[counts["Delivery timing"].str.contains("early")]\n        late = counts[counts["Delivery timing"].str.contains("late")]'''
          new_delivery = '''        valid["Delivery timing"] = valid["days_from_promise"].map(delivery_timing_band)\n        valid["Delivery timing"] = pd.Categorical(valid["Delivery timing"], categories=DELIVERY_TIMING_ORDER, ordered=True)\n        counts = valid.dropna(subset=["Delivery timing"]).groupby("Delivery timing", observed=False)["order_id"].nunique().rename("Orders").reset_index()\n        counts["Delivery timing"] = counts["Delivery timing"].astype(str)\n        early = counts[counts["Delivery timing"].str.contains("early")]\n        on_time = counts[counts["Delivery timing"].eq("On time")]\n        late = counts[counts["Delivery timing"].str.contains("late")]'''
          replace_once(old_delivery, new_delivery)

          replace_once(
              '''        fig.add_trace(go.Bar(\n            x=late["Delivery timing"], y=late["Orders"], name="Late", marker_color=RED,''',
              '''        fig.add_trace(go.Bar(\n            x=on_time["Delivery timing"], y=on_time["Orders"], name="On time", marker_color=BLUE,\n            text=on_time["Orders"], texttemplate="%{text:,.0f}", textposition="outside", textfont={"size": 10}, cliponaxis=False,\n            customdata=on_time[["Orders"]], hovertemplate="%{x}<br>Orders: %{y:,.0f}<extra></extra>",\n        ))\n        fig.add_trace(go.Bar(\n            x=late["Delivery timing"], y=late["Orders"], name="Late", marker_color=RED,''',
          )

          replace_once(
              'xaxis={"title": "Days from promise (early ← promise → late)", "categoryorder": "array", "categoryarray": labels, "tickangle": -35},',
              'xaxis={"title": "Delivery timing relative to promised date", "categoryorder": "array", "categoryarray": DELIVERY_TIMING_ORDER, "tickangle": -35},',
          )
          replace_once(
              'st.caption("Green bars are early deliveries and red bars are late deliveries; bar height shows the number of orders in each timing band.")',
              'st.caption("Green bars are early deliveries, blue is exactly on the promised date (0 days), and red bars are late deliveries; bar height shows the number of orders in each timing band.")',
          )

          old_experience_start = '''def delivery_experience(frame: pd.DataFrame) -> None:\n    st.header("Negative Review Analysis")\n    st.caption("Assess how delivery timing relates to customer review outcomes, focusing on average review score and negative review rate.")\n    reviewed = delivered_orders(frame).dropna(subset=["review_score", "is_negative_review"]).copy()\n    if reviewed.empty:\n        st.info("No reviewed orders with valid delivery outcomes match the filters.")\n        return\n    reviewed["days_early"] = -reviewed["days_late"].astype(float)\n    bins = [-999, -30, -15, -7, -3, 0, 3, 7, 15, 999]\n    labels = ["30+ late", "15–30 late", "7–15 late", "3–7 late", "0–3 late", "0–3 early", "3–7 early", "7–15 early", "15+ early"]\n    reviewed["Delivery timing"] = pd.cut(reviewed["days_early"], bins=bins, labels=labels, ordered=True)\n    timing = reviewed.dropna(subset=["Delivery timing"]).groupby("Delivery timing", observed=False, as_index=False).agg(**{"Average review score": ("review_score", "mean"), "Negative review rate": ("is_negative_review", "mean"), "Reviewed orders": ("order_id", "nunique")})\n    timing["Delivery timing"] = pd.Categorical(timing["Delivery timing"].astype(str), categories=labels, ordered=True)\n    timing = timing.sort_values("Delivery timing", ascending=False)'''
          new_experience_start = '''def delivery_experience(frame: pd.DataFrame) -> None:\n    st.header("Negative Review Analysis (Review Score < 3)")\n    st.caption("A negative review is explicitly defined as a review score of 1 or 2. Assess how delivery timing relates to average review score and the share of reviews below 3 stars.")\n    reviewed = delivered_orders(frame).dropna(subset=["review_score", "is_negative_review"]).copy()\n    if reviewed.empty:\n        st.info("No reviewed orders with valid delivery outcomes match the filters.")\n        return\n    reviewed["Delivery timing"] = reviewed["days_late"].map(delivery_timing_band)\n    reviewed["Delivery timing"] = pd.Categorical(reviewed["Delivery timing"], categories=DELIVERY_TIMING_ORDER, ordered=True)\n    timing = reviewed.dropna(subset=["Delivery timing"]).groupby("Delivery timing", observed=False, as_index=False).agg(**{"Average review score": ("review_score", "mean"), "Negative review rate": ("is_negative_review", "mean"), "Reviewed orders": ("order_id", "nunique")})\n    timing["Delivery timing"] = pd.Categorical(timing["Delivery timing"].astype(str), categories=DELIVERY_TIMING_ORDER, ordered=True)\n    timing = timing.sort_values("Delivery timing")'''
          replace_once(old_experience_start, new_experience_start)

          replace_once(
              'cols[2].metric("Negative review rate", percent(reviewed["is_negative_review"].mean()), help="Share of reviewed delivered orders classified as a negative review under the Phase 1 prepared-data definition.")',
              'cols[2].metric("Negative review rate (<3 stars)", percent(reviewed["is_negative_review"].mean()), help="Share of reviewed delivered orders with review score 1 or 2.")',
          )
          replace_once(
              'fig.update_layout(title="Negative review rate by delivery timing", showlegend=False)',
              'fig.update_layout(title="Negative review rate (Review Score < 3) by delivery timing", showlegend=False)',
          )
          replace_once(
              'fig.update_yaxes(title="Negative review rate", tickformat=".0%", range=[0, min(negative_max * 1.22, 1.08)])',
              'fig.update_yaxes(title="Negative review rate (<3 stars)", tickformat=".0%", range=[0, min(negative_max * 1.22, 1.08)])',
          )
          replace_once(
              'st.caption("Both charts use the same early-to-late timing order. Colour has the same meaning in both: green = better customer outcome, red = worse customer outcome.")',
              'st.caption("Both charts use the same 30+ days early to 30+ days late timing bands, with an explicit On time (0 days) category. Negative review means review score 1 or 2. Colour has the same meaning in both: green = better customer outcome, red = worse customer outcome.")',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate syntax and targeted changes
        run: |
          python -m py_compile deployment/streamlit/app.py
          grep -q 'Negative Review Analysis (Review Score < 3)' deployment/streamlit/app.py
          grep -q 'Order volume and average order value over time' deployment/streamlit/app.py
          grep -q '"On time"' deployment/streamlit/app.py

      - name: Commit dashboard changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/streamlit/app.py
          git commit -m 'Clarify delivery timing and add overview trend toggle'
          git push origin HEAD:feature/dashboard-timing-clarity
