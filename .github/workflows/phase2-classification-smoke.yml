name: Phase 2 classification smoke test

on:
  pull_request:
    paths:
      - "src/classification_*.py"
      - "notebooks/phase2_negative_review_classification.ipynb"
      - ".github/workflows/phase2-classification-smoke.yml"

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pandas numpy scikit-learn joblib matplotlib jupyter nbconvert
      - name: Execute Phase 2 classification notebook
        run: jupyter nbconvert --to notebook --execute notebooks/phase2_negative_review_classification.ipynb --output /tmp/phase2-executed.ipynb --ExecutePreprocessor.timeout=600
