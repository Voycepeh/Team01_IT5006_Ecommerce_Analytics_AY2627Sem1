name: Dashboard tests

on:
  pull_request:
    paths:
      - "deployment/streamlit/**"
      - "src/classification_*.py"
      - "tests/test_classification_foundation.py"
      - "tests/test_streamlit_dashboard.py"
      - "requirements.txt"
      - ".github/workflows/dashboard-tests.yml"
  push:
    branches: [main]
    paths:
      - "deployment/streamlit/**"
      - "src/classification_*.py"
      - "tests/test_classification_foundation.py"
      - "tests/test_streamlit_dashboard.py"
      - "requirements.txt"
      - ".github/workflows/dashboard-tests.yml"

jobs:
  test-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run repository unit tests
        run: pytest -q
