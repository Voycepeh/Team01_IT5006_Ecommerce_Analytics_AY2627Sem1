name: Run Phase 2 classification notebook

on:
  pull_request:
    paths:
      - "notebooks/phase2_negative_review_classification.ipynb"
      - "src/classification_*.py"
      - "data/processed/order_level.csv"
      - "data/processed/item_level.csv"
      - "requirements.txt"
      - ".github/workflows/phase2-classification-notebook.yml"
  workflow_dispatch:

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nbconvert
      - name: Execute notebook
        run: |
          jupyter nbconvert             --to notebook             --execute notebooks/phase2_negative_review_classification.ipynb             --output phase2_negative_review_classification.executed.ipynb             --ExecutePreprocessor.timeout=1200
      - name: Upload executed notebook
        uses: actions/upload-artifact@v4
        with:
          name: phase2-classification-executed-notebook
          path: notebooks/phase2_negative_review_classification.executed.ipynb
